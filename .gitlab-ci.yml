stages:
  - build

variables:
  # Dependencies (OpenVolumeMesh, googletest) are pinned as git submodules in
  # third_party/, so the runner has to check them out as well.
  GIT_SUBMODULE_STRATEGY: recursive

gcc-c++17:
  stage: build
  script: "CI/ci-linux.sh gcc C++17"
  tags:
    - Linux

clang-c++17:
  stage: build
  script: "CI/ci-linux.sh clang C++17"
  tags:
    - Linux

